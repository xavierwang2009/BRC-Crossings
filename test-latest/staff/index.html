<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>BRC Crossings · Staff preview</title>
  <link rel="stylesheet" href="staff.css?v=3">
  <script defer src="../src/staff-profile.js?v=1"></script>
  <script defer src="profile-editor.js?v=1"></script>
  <script defer src="staff.js?v=3"></script>
</head>
<body>
  <header>
    <div class="bar">
      <div class="brand"><img src="../assets/icon-192.png" alt="" width="42" height="42"><strong>BRC Crossings <span lang="zh">同渡</span></strong></div>
      <select id="lang" aria-label="Language / 語言"><option value="en">English</option><option value="ht">繁體中文</option><option value="hs">简体中文</option></select>
    </div>
  </header>
  <main id="app"></main>
  <dialog id="profile-dialog" aria-labelledby="profile-title"><form></form></dialog>
  <dialog id="resolve-dialog" aria-labelledby="resolve-title">
    <h2 id="resolve-title"></h2>
    <form method="dialog">
      <button class="secondary" value="edit" autofocus></button>
      <button class="primary" value="save"></button>
    </form>
  </dialog>
  <div id="feedback" class="sr" role="status"></div>
